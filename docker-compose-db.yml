name: 'api-trellify'
services:
  mongodb:
    image: mongo:latest
    hostname: ${MONGODB_HOSTNAME}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
    volumes:
      - mongodb-data:/data/db/
      - mongodb-log:/var/log/mongodb/
    ports:
      - '${MONGODB_HOST_PORT}:${MONGODB_PORT}'

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT}:${REDIS_PORT}'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data

volumes:
  mongodb-data:
    driver: local
    name: trellify-mongo-data
  mongodb-log:
    driver: local
    name: trellify-mongo-log
  redis_data:
    driver: local
    name: trellify-redis-data