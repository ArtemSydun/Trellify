name: 'api-trellify-${STAGE}'
services:
  node:
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: ${STAGE}
    restart: always
    env_file: .env.${STAGE}
    ports:
      - '${BACKEND_HOST_PORT}:${BACKEND_PORT}'
    depends_on:
      - mongodb
      - redis
    networks:
      - backend_network

  mongodb:
    image: mongo:latest
    hostname: ${MONGODB_HOSTNAME}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
    volumes:
      - mongodb-data:/data/db/
      - mongodb-log:/var/log/mongodb/
      - ./mongodb/initdb.d/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - '${MONGODB_HOST_PORT}:${MONGODB_PORT}'
    networks:
      - backend_network

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - '${REDIS_HOST_PORT}:${REDIS_PORT}'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    networks:
      - backend_network

volumes:
  mongodb-data:
    driver: local
    name: trellify-mongo-data-${STAGE}
  mongodb-log:
    driver: local
    name: trellify-mongo-log-${STAGE}
  redis_data:
    driver: local
    name: trellify-redis-data-${STAGE}

networks:
  backend_network:
    driver: bridge
    name: trellify-backend-network-${STAGE}
